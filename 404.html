<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script type="module">
    import { ROUTE_PAGES } from './src/js/routes.js';

    // Redirect deep links to index.html while preserving requested SPA route.
    (function () {
      var pathname = window.location.pathname;
      var search = window.location.search || '';

      var segments = pathname.split('/').filter(Boolean);
      var lastSegment = segments[segments.length - 1] || '';

      var basePath = '';
      var routePath = '/';

      if (segments.length === 0) {
        routePath = '/';
      } else if (ROUTE_PAGES.includes(lastSegment)) {
        basePath = '/' + segments.slice(0, -1).join('/');
        routePath = lastSegment === 'home' ? '/' : '/' + lastSegment;
      } else {
        basePath = '/' + segments.join('/');
      }

      var target = (basePath || '') + '/?p=' + encodeURIComponent(routePath) + search;
      window.location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
