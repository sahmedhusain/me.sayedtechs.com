<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a192f">
  <script>
    (function() {
      var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname.startsWith('192.168.');
      var basePath = isLocal ? '/' : '/me/';
      document.write('<base href="' + basePath + '">');
    })();
  </script>
  <title>404 | Page Not Found</title>
  <link rel="icon" type="image/svg+xml" href="src/assets/favicon.svg">
  <link rel="stylesheet" href="src/css/main.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    
    .blob {
      position: absolute;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.5;
      animation: float 20s infinite ease-in-out alternate;
    }
    
    .blob-1 {
      width: 400px;
      height: 400px;
      background: var(--accent);
      top: -100px;
      left: -100px;
      border-radius: 50%;
    }
    
    .blob-2 {
      width: 500px;
      height: 500px;
      background: rgba(37, 211, 102, 0.4); /* Greenish */
      bottom: -150px;
      right: -100px;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      animation-delay: -5s;
    }
    
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -50px) scale(1.1); }
      66% { transform: translate(-30px, 40px) scale(0.9); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .not-found-container {
      position: relative;
      z-index: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2rem;
      padding: 4rem 3rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      max-width: 90%;
      width: 500px;
    }

    .error-code {
      font-size: 8rem;
      font-weight: 800;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: var(--font-sans);
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 1rem 0;
      color: var(--text-primary);
    }

    .error-msg {
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      font-size: 1rem;
      line-height: 1.6;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.8rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      background: rgba(var(--accent-rgb, 255, 255, 255), 0.9);
    }
  </style>
  <script type="module">
    import { ROUTE_PAGES } from './src/js/routes.js';
    import { loadLocale, t } from './src/js/constants/i18n.js';

    // 1. Try to load locale immediately so we can translate the page
    async function initTranslation() {
      try {
        await loadLocale('en'); // Default to EN for now
        document.getElementById('error-title').textContent = t('notFound.title');
        document.getElementById('error-msg').textContent = t('notFound.message');
        document.getElementById('home-btn-text').textContent = t('notFound.goHome');
      } catch (e) {
      }
    }

    // 2. Redirect logic (preserving SPA route)
    function handleRouting() {
      var pathname = window.location.pathname;
      var search = window.location.search || '';
      var routes = ['home', 'about', 'articles', 'article', 'journey', 'portfolio', 'projects', 'project', 'contact'];
      var segments = pathname.split('/').filter(Boolean);
      
      var baseSegments = [];
      var routeSegments = [];
      var foundRoute = false;
      
      for (var i = 0; i < segments.length; i++) {
        if (foundRoute || routes.indexOf(segments[i]) !== -1) {
          foundRoute = true;
          routeSegments.push(segments[i]);
        } else {
          baseSegments.push(segments[i]);
        }
      }
      
      // If we found a valid route in the path, redirect to index.html with query param
      if (foundRoute && routeSegments.length > 0) {
        var basePath = '/' + baseSegments.join('/');
        var routePath = '/' + routeSegments.join('/');
        var target = (basePath === '/' ? '' : basePath) + '/?p=' + encodeURIComponent(routePath) + search;
        window.location.replace(target);
      } else {
        // Only show 404 UI if we didn't redirect
        document.getElementById('not-found-ui').style.display = 'block';
        initTranslation();
      }
    }

    document.addEventListener('DOMContentLoaded', handleRouting);
  </script>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Initially hidden, only shown if it's a genuine 404 and not a deep link reload -->
  <div class="not-found-container" id="not-found-ui" style="display: none;">
    <h1 class="error-code">404</h1>
    <h2 class="error-title" id="error-title">Page Not Found</h2>
    <p class="error-msg" id="error-msg">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="home-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span id="home-btn-text">Go Home</span>
    </a>
  </div>
</body>
</html>
