<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script type="module">
    import { ROUTE_PAGES } from './src/js/routes.js';

    // Redirect deep links to index.html while preserving requested SPA route.
    // Redirect deep links to index.html while preserving requested SPA route.
    (function () {
      var pathname = window.location.pathname;
      var search = window.location.search || '';
      var routes = ['home', 'about', 'articles', 'article', 'journey', 'projects', 'contact'];
      var segments = pathname.split('/').filter(Boolean);
      
      var baseSegments = [];
      var routeSegments = [];
      var foundRoute = false;
      
      for (var i = 0; i < segments.length; i++) {
        if (foundRoute || routes.indexOf(segments[i]) !== -1) {
          foundRoute = true;
          routeSegments.push(segments[i]);
        } else {
          baseSegments.push(segments[i]);
        }
      }
      
      var basePath = '/' + baseSegments.join('/');
      var routePath = '/' + routeSegments.join('/');
      
      var target = (basePath === '/' ? '' : basePath) + '/?p=' + encodeURIComponent(routePath) + search;
      window.location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
