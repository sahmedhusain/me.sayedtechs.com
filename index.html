<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a192f">
    <script>
      (function() {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var basePath = isLocal ? '/' : '/me/';
        document.write('<base href="' + basePath + '">');

        // Handle GitHub Pages SPA redirect from 404.html
        var searchParams = new URLSearchParams(window.location.search);
        var p = searchParams.get('p');
        if (p) {
          searchParams.delete('p');
          var newSearch = searchParams.toString();
          newSearch = newSearch ? '?' + newSearch : '';
          var newUrl = basePath.replace(/\/$/, '') + p + newSearch + window.location.hash;
          window.history.replaceState(null, null, newUrl);
        }
      })();
    </script>
    <title>Sayed Ahmed Husain | Electrical Engineer & Full-Stack Developer</title>
