<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a192f">
    <script>
      (function() {
        var path = window.location.pathname;
        var routes = ['home', 'about', 'articles', 'article', 'journey', 'projects', 'contact'];
        var segments = path.split('/').filter(Boolean);
        var baseSegments = [];
        for (var i = 0; i < segments.length; i++) {
          var s = segments[i].toLowerCase();
          if (routes.indexOf(s) !== -1 || s === 'index.html') break;
          baseSegments.push(segments[i]);
        }
        var basePath = '/' + baseSegments.join('/') + (baseSegments.length ? '/' : '');
        if (basePath === '') basePath = '/';
        document.write('<base href="' + basePath + '">');
      })();
    </script>
    <title>Sayed Ahmed Husain | Electrical Engineer & Full-Stack Developer</title>
    <link rel="icon" type="image/svg+xml" href="src/assets/favicon.svg">
    <link rel="alternate icon" type="image/png" href="src/assets/IMG_2174.PNG">
    <link rel="apple-touch-icon" sizes="180x180" href="src/assets/IMG_2174.PNG">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="src/css/main.css">
</head>
<body>
    <div id="app"></div>
    <script type="module" src="main.js"></script>
</body>
</html>
