<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resume — Sayed Ahmed Husain</title>
  <link rel="stylesheet" href="../css/resume.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

  <main class="resume-wrapper">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">

      <!-- Primary Panel: Profile & Contact -->
      <div class="glass-panel">
        <div class="profile-section">
          <img src="" alt="" data-alt="profile" class="profile-img">
          <h1 class="name"></h1>
          <ul class="title-list"></ul>
        </div>

        <h3 data-contact-title style="margin-top: 14px;"></h3>
        <div class="contact-list" style="margin-bottom: 4px;"></div>
        <div class="sidebar-section">
          <h3 data-sidebar="topSkills"></h3>
          <div class="skills-pills" data-sidebar-container="topSkills"></div>
        </div>

        <div class="sidebar-section" style="margin-bottom: 0;">
          <h3 data-sidebar="languages"></h3>
          <div class="skills-pills" data-sidebar-container="languages"></div>
        </div>
      </div>

    </aside>

    <!-- RIGHT MAIN CONTENT (Glass Panel) -->
    <section class="glass-panel main-content">

      <!-- Summary -->
      <div data-section="summary">
        <h2 class="section-title" data-section-heading="summary"></h2>
        <p class="summary-text"></p>
      </div>

      <!-- Experience -->
      <div data-section="experience">
        <h2 class="section-title" data-section-heading="experience"></h2>
        <div class="item-group"></div>
      </div>

      <!-- Internships & Training -->
      <div data-section="internships">
        <h2 class="section-title" data-section-heading="internships"></h2>
        <div class="item-group"></div>
      </div>

      <!-- Education -->
      <div data-section="education">
        <h2 class="section-title" data-section-heading="education"></h2>
        <div class="item-group"></div>
      </div>

      <!-- Certifications -->
      <div data-section="certifications">
        <h2 class="section-title" data-section-heading="certifications"></h2>
        <div class="item-group"></div>
      </div>

      <!-- Technical Projects -->
      <div data-section="projects">
        <h2 class="section-title" data-section-heading="projects"></h2>
        <div class="item-group"></div>
      </div>

      <!-- Comprehensive Technical Skills -->
      <div data-section="technicalSkills">
        <h2 class="section-title" data-section-heading="technicalSkills"></h2>
        <div class="item-group" style="gap: 20px;"></div>
      </div>

    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script type="module" src="../js/resume.js"></script>
</body>

</html>
